name: UBI IB Collector
run-name: ${{ github.actor }} is Collecting 🚀
on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 0 1 * *" # Update on First of month at midnight UTC
  workflow_dispatch:

jobs:
  Date:
    uses: ./.github/workflows/reusable-date.yml
    permissions: {}

  Skopeo:
    needs: [Date]
    uses: ./.github/workflows/reusable-skopeo.yml
    with:
      date: ${{ needs.Date.outputs.date }}
    secrets: inherit
    permissions:
      contents: read

  Code:
    needs: [Date]
    uses: ./.github/workflows/reusable-code.yml
    with:
      date: ${{ needs.Date.outputs.date }}
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write

  Scan:
    needs: [Date]
    uses: ./.github/workflows/reusable-scan.yml
    with:
      date: ${{ needs.Date.outputs.date }}
    secrets: inherit
    permissions:
      contents: read

  Release:
    runs-on: ubuntu-latest
    needs: [Date, Code, Skopeo, Scan]
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Show Artifacts
        run: ls -1sh ${{ vars.COLLECTOR }}-*.*

      - name: Set up git
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"

      - name: Create tag
        uses: rickstaa/action-create-tag@v1
        id: tag_create
        with:
          tag: ${{ needs.Date.outputs.date }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_exists_error: false
          message: "Release for ${{ needs.Date.outputs.date }} run"

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ vars.COLLECTOR }} ${{ needs.Date.outputs.date }}
          tag_name: ${{ needs.Date.outputs.date }}
          make_latest: true
          files: |
            ${{ vars.COLLECTOR }}-${{ needs.Date.outputs.date }}*.*
